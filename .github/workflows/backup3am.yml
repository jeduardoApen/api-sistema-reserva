name: Auto Merge PreProducción into main

on:
  schedule:
    - cron: '0 9 * * *' # 3am
  workflow_dispatch:

jobs:
  auto-merge:
    name: Merge PreProduccion -> main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch ORG branch
        run: git fetch origin ORG:ORG

      - name: Merge ORG into main
        id: merge
        run: |
          git checkout main
          if git merge --no-ff origin/ORG -m "Auto-merge ORG into main"; then
            echo "MERGE_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "MERGE_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Push changes
        if: env.MERGE_SUCCESS == 'true'
        run: git push origin main

      - name: Cancel on merge conflict
        if: env.MERGE_SUCCESS == 'false'
        run: |
          echo "::error ::Merge conflict detected. Manual resolution required."
          exit 1
