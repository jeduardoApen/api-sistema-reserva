name: Auto Merge PreProducción into main

on:
  schedule:
    - cron: '0 9 * * *' # 3am
  workflow_dispatch:

permissions:
  contents: write

jobs:
  auto-merge:
    name: Merge PreProduccion -> main
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch ORG branch
        run: git fetch origin ORG

      - name: Merge ORG into main
        id: merge
        run: |
          set +e
          git checkout main
          MERGE_OUTPUT=$(git merge --no-ff origin/ORG -m "Auto-merge ORG into main" 2>&1)
          EXIT_CODE=$?
          
          echo "$MERGE_OUTPUT"
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "MERGE_STATUS=success" >> $GITHUB_ENV
            echo "Merge realizado correctamente."
          elif echo "$MERGE_OUTPUT" | grep -q "Already up to date"; then
            echo "MERGE_STATUS=up_to_date" >> $GITHUB_ENV
            echo "Las ramas ya están sincronizadas. No se requiere push."
          else
            echo "MERGE_STATUS=failed" >> $GITHUB_ENV
            echo "::warning ::Falló el merge automático."
            git status
            git merge --abort || true
          fi

      - name: Push changes
        if: env.MERGE_SUCCESS == 'true'
        run: git push origin main

      - name: Cancel on merge conflict
        if: env.MERGE_SUCCESS == 'false'
        run: |
          echo "::error ::Merge conflict detected. Manual resolution required."
          exit 1
